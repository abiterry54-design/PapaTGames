<!DOCTYPE html>
<html>
<head>
    <title>Speech Test</title>
</head>

<body>

    <h1>Speech Test</h1>

    <h2 id="word">DOOR</h2>

    <button onclick="startListening()">🎤 Speak</button>

    <button id="testVoice">🔊 Test Voice</button>
    <p id="voiceStatus">Voice waiting...</p>

    <p id="status">Press Speak and say a word.</p>
    <p id="heard"></p>
    <p id="result"></p>


  <script>
    let expectedWord = "door";

    function startListening() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        const recognition = new SpeechRecognition();

        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        document.getElementById("status").innerHTML =
            "Listening...";

        recognition.start();

        recognition.onresult = function(event) {

            let spokenWord =
                event.results[0][0].transcript;

            spokenWord = spokenWord
                .trim()
                .toLowerCase()
                .replace(/[.,!?]/g, "");

            document.getElementById("heard").innerHTML =
                "You said: " + spokenWord;

            if (spokenWord === expectedWord) {
                document.getElementById("result").innerHTML =
                    "✅ Correct!";
            }
            else {
                document.getElementById("result").innerHTML =
                    "❌ Try Again";
            }

            console.log("Expected:", expectedWord);
            console.log("Heard:", spokenWord);
        };

        recognition.onerror = function(event) {

            document.getElementById("status").innerHTML =
                "Speech error: " + event.error;

            console.log("Speech error:", event.error);
        };
    }

const testVoiceButton = document.getElementById("testVoice");
const voiceStatus = document.getElementById("voiceStatus");

testVoiceButton.addEventListener("click", function () {

    voiceStatus.textContent = "Trying to speak...";

    const message = new SpeechSynthesisUtterance(
        "Hello Laken! Papa T's learning game can talk!"
    );

    message.onstart = function () {
        voiceStatus.textContent = "Speech started!";
    };

    message.onend = function () {
        voiceStatus.textContent = "Speech finished!";
    };

    message.onerror = function (event) {
        voiceStatus.textContent = "Speech error: " + event.error;
    };

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(message);
});
</script>

</body>
</html>
