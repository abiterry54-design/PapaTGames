<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>Papa T's Trucks</title>

    <link rel="stylesheet" href="trucks.css">
</head>

<body>

    <div id="game">

        <div id="message">
            Papa T's Trucks
        </div>

        <div id="world">

            <div id="sky"></div>

            <div id="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
                <div class="cloud cloud4"></div>
            </div>

            <div id="mountains">
                <div class="mountain mountain1"></div>
                <div class="mountain mountain2"></div>
                <div class="mountain mountain3"></div>
                <div class="mountain mountain4"></div>
                <div class="mountain mountain5"></div>
                <div class="mountain mountain6"></div>
                <div class="mountain mountain7"></div>
                <div class="mountain mountain8"></div>
            </div>

            <div id="neighborhood">

                <div class="house redHouse">
                    <div class="roof"></div>
                    <div class="houseBody">
                        <div class="window windowLeft"></div>
                        <div class="window windowRight"></div>
                        <div class="door"></div>
                    </div>
                </div>
                <div class="tree tree1">
                    <div class="treeTop"></div>
                    <div class="treeTrunk"></div>
                </div>

                <div class="tree tree2">
                    <div class="treeTop"></div>
                    <div class="treeTrunk"></div>
                </div>

                <div class="house blueHouse">
                <div class="roof"></div>
                <div class="houseBody">
                    <div class="window windowLeft"></div>
                    <div class="window windowRight"></div>
                    <div class="door"></div>
                </div>
            </div>

            </div>

            <div id="curb"></div>

            <div id="road">

                <div id="roadLines">
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                    <div class="roadLine"></div>
                </div>

            </div>

            <div id="dumpsters">
                <div class="dumpster" data-answer="4">4</div>
                <div class="dumpster" data-answer="7">7</div>
                <div class="dumpster" data-answer="9">9</div>
            </div>

            <div id="truck">

                <img id="truckBody"
                    src="images/trucks/garbage/truck-body.png"
                    alt="Garbage truck">

                <img class="wheel frontWheel"
                    src="images/trucks/garbage/truck-wheel.png"
                    alt="">

                <img class="wheel rearWheel"
                    src="images/trucks/garbage/truck-wheel.png"
                    alt="">

                <div id="pickupPoint"></div>

                <div id="loaderArm">
                    <div id="loaderForks"></div>
                </div>
             

            </div>

        </div>

    </div>

    <script src="trucks.js"></script>

</body>
</html>
