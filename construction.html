<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Papa T's Construction World</title>
    <link rel="stylesheet" href="construction.css">
</head>

<body>
    <div id="viewport">
        <div id="world">

            </section>

            <img
                id="excavator"

                alt="Excavator"
                draggable="false"
            >


        </div>
    </div>

    <script src="construction.js"></script>

</html>
