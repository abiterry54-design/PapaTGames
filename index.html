<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terry's Learning Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Papa T's Learning Game!</h1>
    <p class="version">v1.2 - mic/p>

<div class = "card">
    <h2 id="question"></h2>
    <h2 id="answer"></h2>
</div>

    <button id="showButton" class="gameButton" onclick="showAnswer()">Show Answer</button>
    <button id="gotItButton" class="gameButton" onclick="gotIt()"> Got It! </button>
    <button id="missedButton" class="gameButton" onclick="missedIt()">Try Again</button>
    <button id="playAgainButton" class="gameButton" onclick="startNewRound()">Play Again</button>
    <button id="speakButton" class="gameButton" onclick="startListening()"> 🎤 Speak</button>

 <!-- For clearing out array in localStorage 
        <button class="gameButton" onclick="resetProgress()">Reset Progress</button>
-->
<!-- For stepping through a deck.
     <button class="gameButton" onclick="nextCard()"> Next Card </button> 
-->
    <p id="score"> </p>

<script src="script.js"></script>
</body>
</html>
