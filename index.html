
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Papa T's Games</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <main class="home">
        <h1>Hi Kids! 👋</h1>
        <h2>Welcome to Papa T's Games!</h2>

        <p>Who's playing today?</p>

        <div class="studentButtons">
            <button onclick="selectStudent('Laken', this)">
                Laken
            </button>

            <button onclick="selectStudent('Orion', this)">
                Orion
            </button>
        </div>

        <h2 id="greeting">Choose your name!</h2>

        <div class="gameButtons">
            <button id="wordsButton"
                    onclick="startGame('ptlg.html')"
                    disabled>
                📚 Words & Math
            </button>

            <button id="orionButton"
                    onclick="startGame('ptog.html')"
                🔴 Shapes & Colors
                <small>Let's Play!</small>
            </button>
        </div>
    </main>

    <script>
        let studentName = "";

        function selectStudent(name, button) {
            studentName = name;

            document.getElementById("greeting").textContent =
                "Hi " + name + "! What shall we play?";

            document.querySelectorAll(".studentButtons button")
                .forEach(b => b.classList.remove("selected"));

            button.classList.add("selected");

            document.getElementById("wordsButton").disabled = false;
        }

        function startGame(page) {
            if (!studentName) return;

            window.location.href =
                page + "?student=" + encodeURIComponent(studentName);
        }
    </script>
</body>
</html>
